services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: orderflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7
    container_name: orderflow-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: orderflow-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: orderflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  nginx-gateway:
    image: nginx:1.27
    container_name: orderflow-nginx-gateway
    ports:
      - "8080:8080"
    volumes:
      - ../backend/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mongodb_data:
  elasticsearch_data:
