apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-api
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service-api
  template:
    metadata:
      labels:
        app: order-service-api
    spec:
      containers:
        - name: order-service-api
          image: orderflow-order-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
            - name: DATABASE_URL
              value: postgres://orderflow_user:orderflow_password@host.docker.internal:5432/orderflow_orders
            - name: RABBITMQ_URL
              value: amqp://host.docker.internal:5672
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orderflow
spec:
  type: ClusterIP
  selector:
    app: order-service-api
  ports:
    - name: http
      port: 4002
      targetPort: 4002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-worker
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service-worker
  template:
    metadata:
      labels:
        app: order-service-worker
    spec:
      containers:
        - name: order-service-worker
          image: orderflow-order-service:local
          imagePullPolicy: Never
          command: ["npm", "run", "worker"]
          env:
            - name: DATABASE_URL
              value: postgres://orderflow_user:orderflow_password@host.docker.internal:5432/orderflow_orders
            - name: RABBITMQ_URL
              value: amqp://host.docker.internal:5672
